<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <h2>Вход в систему</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="login" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Войти</button>
            <div id="error" class="error"></div>
        </form>
        <button class="btn-secondary" onclick="window.location.href='register.html'">Регистрация</button>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const res = await fetch('http://127.0.0.1:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();

                if (res.ok) {
                    sessionStorage.setItem('user_id', data.user_id);
                    sessionStorage.setItem('role_id', data.role_id);
                    if (data.role_id === 3 || data.role_id === 4) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'applications.html';
                    }
                } else {
                    errorDiv.innerText = data.error || 'Ошибка входа';
                }
            } catch (err) {
                errorDiv.innerText = ' Ошибка соединения с сервером';
            }
        });
    </script>
</body>
</html>
