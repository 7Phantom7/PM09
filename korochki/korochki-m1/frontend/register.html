<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Логин (от 6 символов, латиница)</label>
                <input type="text" id="login" required pattern="[A-Za-z0-9]{6,}">
            </div>
            <div class="form-group">
                <label>Пароль (от 8 символов)</label>
                <input type="password" id="password" required minlength="8">
            </div>
            <div class="form-group">
                <label>ФИО (кириллица)</label>
                <input type="text" id="full_name" required pattern="[А-Яа-яЁё\s\-]+">
            </div>
            <div class="form-group">
                <label>Телефон (формат: 8(XXX)XXX-XX-XX)</label>
                <input type="text" id="phone" required placeholder="8(999)000-00-00">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit">Зарегистрироваться</button>
            <div id="error" class="error"></div>
        </form>
        <button class="btn-secondary" onclick="window.location.href='login.html'">Назад</button>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error');

            try {
                const res = await fetch('http://127.0.0.1:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password, full_name, phone, email })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Регистрация успешна!');
                    window.location.href = 'login.html';
                } else {
                    errorDiv.innerText = data.error || 'Ошибка регистрации';
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения с сервером';
            }
        });
    </script>
</body>
</html>
